# Sert le front Angular (routes côté client) et relaie /api vers le service API de Coolify.
# Lu par le Dockerfile du front. Ta consigne : « On continue jusqu'à la fin ».
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Alias réseau de l'app API dans Coolify : « api » seul risquerait une collision sur le réseau partagé.
  location /api/ {
    proxy_pass http://cartouche-api:3000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  }

  # Les fichiers statiques portent un hachage dans leur nom : cache long.
  location ~* \.(js|css|woff2|png|jpg|svg|ico)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Toutes les autres routes (ludotheque, etagere, e/...) renvoient index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
